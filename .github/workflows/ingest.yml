name: Ingest

on:
  schedule:
  - cron: "0 */6 * * *"
  workflow_dispatch:

# Shared with the migrate workflow so ingestion never overlaps a migration or another
# ingestion run (which could also double-spend the per-source request budgets).
concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
      GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
      LEVER_COMPANIES: ${{ vars.LEVER_COMPANIES }}
      ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
      JOBTECH_QUERY: ${{ vars.JOBTECH_QUERY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_USER_AGENT_EMAIL: ${{ secrets.USAJOBS_USER_AGENT_EMAIL }}
      # Secrets cannot be read in a step's `if`, so expose only whether the key is set.
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m sanket.ingest
      # Runs even when a source failed, so one bad source does not block extraction.
      - name: Extract pending postings
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m sanket.extraction.runner
      # The matcher only sees jobs with an embedding, and nothing queues matching here (no
      # Redis), so index what ingest and extraction changed, then match those jobs inline.
      # Both run only with a Gemini key, and a failure in either (an embedding quota running
      # out, for example) never fails the run: the jobs stay pending for the next one.
      - name: Index new and changed jobs
        if: ${{ !cancelled() && env.HAS_GEMINI_KEY == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m sanket.indexing --apply --limit 500
      - name: Match newly indexed jobs
        if: ${{ !cancelled() && env.HAS_GEMINI_KEY == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python -m sanket.matching rematch --all-jobs --since-days 1 --apply --inline
