name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

# Separate from the prod-db group used by the ingest and migrate workflows: this job only
# touches its own throwaway database, so a new push can cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Throwaway credentials for a database that only exists for this job.
          POSTGRES_USER: sanket_ci
          POSTGRES_PASSWORD: sanket_ci
          POSTGRES_DB: sanket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanket_ci -d sanket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Settings requires DATABASE_URL at import time; point it at the same throwaway database.
      DATABASE_URL: postgresql+psycopg://sanket_ci:sanket_ci@127.0.0.1:5432/sanket_test
      TEST_DATABASE_URL: postgresql+psycopg://sanket_ci:sanket_ci@127.0.0.1:5432/sanket_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate the test database
        run: alembic upgrade head
      - name: Check that the models match the migrations
        run: alembic check
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q -rs --junitxml=pytest-report.xml
      # Database tests skip themselves when TEST_DATABASE_URL is missing, so a skip here
      # means part of the suite silently did not run.
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("pytest-report.xml").getroot()
          if suite.tag == "testsuites":
              suite = suite[0]
          skipped = int(suite.get("skipped", "0"))
          tests = int(suite.get("tests", "0"))
          print(f"{tests} tests, {skipped} skipped")
          if skipped or not tests:
              sys.exit("Skipped or missing tests are not allowed in CI")
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # Builds the backend image to prove the Dockerfile and the compose file stay valid. Nothing
  # is pushed and no secrets are used; the throwaway values below only satisfy the checks.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: sanket-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run as a non-root user
        run: test "$(docker run --rm sanket-backend:ci id -u)" != "0"
      - name: Import the application inside the image
        run: |
          docker run --rm -e DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:1/ci \
            sanket-backend:ci python -c "import sanket.api.app, sanket.worker.run"
      - name: Validate the compose file
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: docker compose --profile observability --profile jobs config --quiet
