name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to run alembic upgrade head against production'
        required: true

concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: alembic current
      - run: alembic upgrade head
      - run: alembic current
