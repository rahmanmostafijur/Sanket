# Prometheus for the Sanket API. Example configuration: adapt the targets to your deployment.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sanket-api
    metrics_path: /metrics
    # /metrics needs METRICS_TOKEN as a bearer token (docs/deploy.md). The token is read from a
    # file so it is never part of this configuration.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
