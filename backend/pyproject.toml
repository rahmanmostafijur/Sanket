[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanket"
version = "0.1.0"
description = "Job-market intelligence service"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "httpx>=0.28,<1",
    "ftfy>=6.3",
    "google-genai>=1.0",
    "pydantic-extra-types>=2.11",
    "pycountry>=24.6",
    "tzdata>=2024.1",
    "pgvector>=0.4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "rq>=3.0,<4",
    "redis>=5,<9",
    "pyjwt[crypto]>=2.9,<3",
    "prometheus-client>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
    "fakeredis[lua]>=2.40,<3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strictness is opt-in per module: the rest of the code base is checked leniently, new modules
# should start strict. To add one, list its dotted name (or a glob such as "sanket.new.*")
# below and run `mypy`; fix what it reports before merging. (`strict = true` is not accepted in a
# per-module section, so the strict flags are spelled out.)
[[tool.mypy.overrides]]
module = [
    "sanket.config",
    "sanket.db",
    "sanket.canonical.*",
    "sanket.sources.ashby",
    "sanket.sources.jobtech_se",
    "sanket.sources.usajobs",
    "sanket.extraction.prompt",
    "sanket.extraction.schema",
    "sanket.indexing.*",
    "sanket.embeddings.*",
    "sanket.search.*",
    "sanket.api.*",
    "sanket.queue.*",
    "sanket.profiles.*",
    "sanket.matching.*",
    "sanket.worker.*",
    "sanket.runtime_checks",
    "sanket.auth.*",
    "sanket.observability.*",
    "sanket.ratelimit.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
